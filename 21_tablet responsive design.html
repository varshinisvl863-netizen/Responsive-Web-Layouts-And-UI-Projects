<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablet Responsive Design</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

/* Header */
.header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:25px;
}

/* Navigation */
.navbar{
    background:#1e293b;
}

.navbar ul{
    display:flex;
    justify-content:center;
    list-style:none;
}

.navbar a{
    color:white;
    text-decoration:none;
    padding:15px 20px;
    display:block;
}

/* Main Layout */
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hero{
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:25px;
}

.card{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* Tablet Layout */
@media (max-width: 992px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .hero{
        padding:30px;
    }

    .navbar ul{
        flex-wrap:wrap;
    }
}

/* Mobile Layout */
@media (max-width: 600px){
    .cards{
        grid-template-columns:1fr;
    }

    .navbar ul{
        flex-direction:column;
        text-align:center;
    }

    .hero{
        padding:20px;
    }

    .header h1{
        font-size:24px;
    }
}

/* Footer */
.footer{
    margin-top:30px;
    background:#1e293b;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>
<body>

<header class="header">
    <h1>Tablet Responsive Design</h1>
</header>

<nav class="navbar">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<div class="container">

    <section class="hero">
        <h2>Welcome to Our Website</h2>
        <p>
            This layout is optimized for tablets, desktops,
            and mobile devices using responsive design techniques.
        </p>
    </section>

    <section class="cards">
        <div class="card">Feature 1</div>
        <div class="card">Feature 2</div>
        <div class="card">Feature 3</div>
        <div class="card">Feature 4</div>
    </section>

</div>

<footer class="footer">
    <p>&copy; 2026 Tablet Responsive Design</p>
</footer>

</body>
</html>
