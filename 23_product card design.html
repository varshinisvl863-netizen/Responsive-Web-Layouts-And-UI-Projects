<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card Design</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* Product Card */
.product-card{
    width:320px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.product-image{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-content{
    padding:20px;
}

.product-category{
    color:#2563eb;
    font-size:14px;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:8px;
}

.product-title{
    font-size:22px;
    color:#1e293b;
    margin-bottom:10px;
}

.product-description{
    color:#64748b;
    line-height:1.5;
    margin-bottom:15px;
}

.product-price{
    font-size:28px;
    color:#2563eb;
    font-weight:bold;
    margin-bottom:15px;
}

.rating{
    color:#f59e0b;
    margin-bottom:15px;
}

.btn{
    display:block;
    width:100%;
    text-align:center;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<div class="product-card">

    <img
        src="https://via.placeholder.com/320x220"
        alt="Product"
        class="product-image"
    >

    <div class="product-content">

        <div class="product-category">
            Electronics
        </div>

        <h2 class="product-title">
            Wireless Headphones
        </h2>

        <p class="product-description">
            Premium wireless headphones with crystal-clear sound,
            noise cancellation, and long battery life.
        </p>

        <div class="rating">
            ★★★★★ (4.9)
        </div>

        <div class="product-price">
            $99.99
        </div>

        <a href="#" class="btn">
            Add to Cart
        </a>

    </div>

</div>

</body>
</html>
